<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Create-A-Hoss</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@800;900&display=swap">
<style>
/* Layout: House of Hoss header bar with ring ropes, the silver nameplate (title card, then the current draw, then the OVR),
   then the figure with five labels pointing at body parts. Tokens and header/plate styles are Blind Booker's
   (blindbooker/template.html); keep them in sync. */
:root{
  --canvas:#BDC1C6; --panel:#FFFFFF; --ink:#0E0F12; --muted:#40474F; --line:#A3A8AF; --well:#D0D3D7;
  --bar:#2F353C; --bar-ink:#FFFFFF; --bar-muted:#AEB4BB; --bar-line:#454C55;
  --rope-r:#5B18EA; --rope-w:#FFFFFF; --rope-b:#0E0F12;
  --plate-a:#F4F5F7; --plate-b:#C3C7CD; --plate-c:#7D848D; --plate-edge:#3D444C; --plate-ink:#0E0F12;
  --plate-shine:rgba(255,255,255,.6);
  --accent:#5B18EA; --on-accent:#FFFFFF; --accent-soft:rgba(91,24,234,.10); --bad:#B3202B; --bad-soft:rgba(200,35,47,.12);
  --focus:#5B18EA; --shadow:rgba(14,15,18,.18);
  --spot:#E9EBEE; --wire:#40474F;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#16181B; --panel:#212429; --ink:#EEEFF1; --muted:#9BA2AA; --line:#33383F; --well:#2A2E34;
    --bar:#0B0C0E; --bar-ink:#FFFFFF; --bar-muted:#8D949C; --bar-line:#2A2F35;
    --rope-r:#8F5CFF; --rope-w:#E6E7EA; --rope-b:#5A616A;
    --plate-a:#DDE0E4; --plate-b:#A6ABB2; --plate-c:#646B74; --plate-edge:#30363D; --plate-ink:#0E0F12;
    --plate-shine:rgba(255,255,255,.45);
    --accent:#8F5CFF; --on-accent:#0E0F12; --accent-soft:rgba(143,92,255,.16); --bad:#FF7A84; --bad-soft:rgba(229,85,94,.18);
    --focus:#A57DFF; --shadow:rgba(0,0,0,.5);
    --spot:#C9CDD2; --wire:#9BA2AA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#16181B; --panel:#212429; --ink:#EEEFF1; --muted:#9BA2AA; --line:#33383F; --well:#2A2E34;
  --bar:#0B0C0E; --bar-ink:#FFFFFF; --bar-muted:#8D949C; --bar-line:#2A2F35;
  --rope-r:#8F5CFF; --rope-w:#E6E7EA; --rope-b:#5A616A;
  --plate-a:#DDE0E4; --plate-b:#A6ABB2; --plate-c:#646B74; --plate-edge:#30363D; --plate-ink:#0E0F12;
  --plate-shine:rgba(255,255,255,.45);
  --accent:#8F5CFF; --on-accent:#0E0F12; --accent-soft:rgba(143,92,255,.16); --bad:#FF7A84; --bad-soft:rgba(229,85,94,.18);
  --focus:#A57DFF; --shadow:rgba(0,0,0,.5);
    --spot:#C9CDD2; --wire:#9BA2AA;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.wrap{max-width:34rem;margin-inline:auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* Header bar and ropes (same as Title Run) */
.bar{background:var(--bar);color:var(--bar-ink)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 14px}
.brand{display:grid;gap:8px;justify-items:start}
.home{display:inline-flex;align-items:center;gap:6px;color:var(--bar-muted);text-decoration:none;font-family:var(--f-label);font-weight:700;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}
.home img{width:18px;height:18px;display:block}
.home:hover,.home:focus-visible{color:var(--bar-ink)}
.mark{font-family:var(--f-display);font-weight:900;font-size:1.75rem;line-height:.85;text-transform:uppercase;letter-spacing:.01em;margin:0}
.mark span{display:block;font-family:var(--f-label);font-weight:600;font-size:.7rem;letter-spacing:.22em;color:var(--bar-muted);margin-top:6px}
.modes{display:flex;gap:2px;padding:3px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--bar-line)}
.modes button{background:none;border:0;border-radius:999px;padding:7px 13px;cursor:pointer;font-family:var(--f-label);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bar-muted)}
.modes button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.ropes{display:grid;gap:4px;padding-block:0 8px;background:var(--bar)}
.ropes i{display:block;height:4px}
.ropes i:nth-child(1){background:var(--rope-r)}
.ropes i:nth-child(2){background:var(--rope-w)}
.ropes i:nth-child(3){background:var(--rope-b)}


/* The draw: silver nameplate showing what you have to place next */
.plate{overflow:hidden;border-radius:14px;padding:20px 26px 18px;color:var(--plate-ink);
  background:
    radial-gradient(circle at 13px 13px, var(--plate-edge) 3px, transparent 3.6px),
    radial-gradient(circle at calc(100% - 13px) 13px, var(--plate-edge) 3px, transparent 3.6px),
    radial-gradient(circle at 13px calc(100% - 13px), var(--plate-edge) 3px, transparent 3.6px),
    radial-gradient(circle at calc(100% - 13px) calc(100% - 13px), var(--plate-edge) 3px, transparent 3.6px),
    linear-gradient(112deg, var(--plate-b) 0%, var(--plate-a) 26%, var(--plate-b) 50%, var(--plate-a) 72%, var(--plate-c) 100%);
  box-shadow:inset 0 0 0 2px var(--plate-edge), inset 0 0 0 5px var(--plate-a), inset 0 0 0 6px var(--plate-edge), 0 8px 22px var(--shadow)}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg, transparent 35%, var(--plate-shine) 50%, transparent 65%);transform:translateX(-120%)}
.plate.glint::after{animation:glint 1s ease-out 1}
@keyframes glint{to{transform:translateX(120%)}}
.eyebrow{font-family:var(--f-label);font-weight:700;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase}
.plate h1{font-family:var(--f-display);font-weight:900;font-size:clamp(2rem, 9vw, 3.1rem);line-height:.92;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere;margin:6px 0 8px;text-shadow:0 1px 0 var(--plate-shine)}
.plate-sub{font-family:var(--f-label);font-weight:700;font-size:.9rem;letter-spacing:.18em;text-transform:uppercase;min-height:1.2em}
.hint{font-size:.92rem;color:var(--muted);margin:0}
[hidden]{display:none!important}
main{display:grid;gap:16px;padding-block:18px 44px}
.meta{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-label);font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Title card: the plate is a button until the first draw */
.plate{position:relative;text-align:center;padding:22px 22px 18px}
.plate.tap{cursor:pointer}
.plate.tap:hover,.plate.tap:focus-visible{box-shadow:inset 0 0 0 2px var(--plate-edge), inset 0 0 0 5px var(--plate-a), inset 0 0 0 6px var(--plate-edge), 0 0 0 3px var(--accent), 0 8px 22px var(--shadow);outline:none}
.plate.title h1{font-size:clamp(2.6rem, 13vw, 4.4rem);margin:2px 0 6px}
.plate.title .plate-sub{color:var(--accent);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
/* Perfect Hoss / 99: purple ring around the plate; the 99 headline is long, so it runs smaller */
.plate.win{box-shadow:inset 0 0 0 2px var(--plate-edge), inset 0 0 0 5px var(--plate-a), inset 0 0 0 6px var(--plate-edge), 0 0 0 4px var(--accent), 0 8px 26px var(--shadow)}
.plate .goat{display:block;font-size:.72em;line-height:.95}
.ovr{display:inline-flex;align-items:baseline;gap:.12em}
.ovr b{font-size:1.9em;line-height:.8}
.ovr small{font-family:var(--f-label);font-weight:700;font-size:.42em;letter-spacing:.16em}

/* The figure and its five labels. Label tops are set per slot (left / right columns); the leader lines are an SVG
   drawn by script.js from each label to its body point. */
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) clamp(118px, 36%, 228px) minmax(0,1fr);align-items:start}
.spot{grid-column:2;position:relative}
.spot::before{content:"";position:absolute;inset:-6% -30%;z-index:0;border-radius:50%;
  background:radial-gradient(closest-side, var(--spot) 0%, var(--spot) 55%, transparent 100%)}
.spot img{position:relative;z-index:1;display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.wires{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.wires path{fill:none;stroke:var(--wire);stroke-width:1.6}
.wires circle{fill:var(--accent);stroke:var(--panel);stroke-width:1.5}
.wires .live path{stroke:var(--accent);stroke-width:2}
/* Labels stack in their column (left: Promo, Look, Ring Work spread top to bottom; right: Popularity, then Finisher),
   so they never overlap; the column grows past the figure if the names run long. */
.col{position:relative;z-index:3;align-self:stretch;display:flex;flex-direction:column;gap:12px;min-width:0}
.col.l{justify-content:space-between}
.col.r{padding-top:6%;gap:clamp(16px, 9%, 48px)}
.tag{position:relative;display:grid;gap:3px;text-align:left;padding:8px 10px 9px;border-radius:10px;
  background:var(--panel);border:1.5px solid var(--line);min-width:0}
.col.r .tag{text-align:right}
.col.l .tag{margin-right:6px}
.col.r .tag{margin-left:6px}
.tag .k{font-family:var(--f-label);font-weight:700;font-size:clamp(.66rem, 2.6vw, .74rem);letter-spacing:clamp(.06em, .5vw, .18em);text-transform:uppercase;color:var(--muted)}
.tag .who{font-family:var(--f-display);font-weight:800;font-size:clamp(.95rem, 3.6vw, 1.25rem);line-height:1.02;text-transform:uppercase;overflow-wrap:break-word;min-width:0}
.tag .who.none{font-family:var(--f-label);font-weight:600;font-size:.86rem;letter-spacing:.12em;color:var(--muted)}
.tag .move{font-size:.8rem;line-height:1.25;color:var(--muted)}
/* Finished Hoss: each name highlighted by how good that part is (green / yellow / orange / red). Same fills in light and dark. */
.hl{padding:0 .16em;border-radius:4px;color:#0E0F12;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl.g{background:#5CCB7E}.hl.y{background:#F2D04B}.hl.o{background:#F49A45}.hl.r{background:#EE6464}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button.tag{cursor:pointer;font:inherit;color:inherit;border:1.5px dashed var(--accent);background:var(--accent-soft)}
button.tag .k{color:var(--accent)}
button.tag .who.none{color:var(--accent)}
button.tag:hover{background:var(--accent);border-style:solid}
button.tag:hover .k,button.tag:hover .who{color:var(--on-accent)}
.tag.fresh{animation:slam .45s cubic-bezier(.2,1.5,.4,1) 1}
@keyframes slam{from{transform:translateY(-8px) scale(1.12);opacity:.2}to{transform:none;opacity:1}}
.tag.best{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}

/* Finished Hoss */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.card h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:1.6rem;line-height:1;text-transform:uppercase}
.share{margin:0;white-space:pre-wrap;font:500 .9rem/1.4 var(--f-body);background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-family:var(--f-label);font-weight:700;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;background:var(--accent);color:var(--on-accent)}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn:active{transform:translateY(1px)}
.status{font-size:.88rem;color:var(--muted);min-height:1.3em;margin:0}
.perfect{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.perfect h3{margin:0;font-family:var(--f-display);font-weight:900;font-size:1.3rem;line-height:1;text-transform:uppercase}
.perfect ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.perfect li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.95rem}
.perfect li .pw{text-align:right;font-family:var(--f-display);font-weight:800;font-size:1.05rem;line-height:1.15;text-transform:uppercase}
.perfect li > span:first-child{white-space:nowrap;font-family:var(--f-label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-size:.82rem}
.perfect p{margin:0;font-size:.92rem;color:var(--muted)}
#copyBox{position:absolute;left:-9999px;top:0}
footer{display:grid;gap:8px;font-size:.8rem;color:var(--muted);padding-block:0 32px;line-height:1.5}
footer p{margin:0}
footer a{color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem}
.links a{font-weight:600;text-underline-offset:3px}
@media (prefers-reduced-motion: reduce){ .tag.fresh,.plate.glint::after,.plate.title .plate-sub{animation:none} }
</style>

<style>

:root[data-egg="deadlock"]{
  --canvas:#F26A1B; --panel:#FFFFFF; --ink:#0B0B0B; --muted:#3B2416; --line:#0B0B0B; --well:#FFE1CC;
  --bar:#0B0B0B; --bar-ink:#FFFFFF; --bar-muted:#F26A1B; --bar-line:#F26A1B;
  --rope-r:#F26A1B; --rope-w:#FFFFFF; --rope-b:#F26A1B;
  --plate-a:#2E2E2E; --plate-b:#0B0B0B; --plate-c:#000000; --plate-edge:#F26A1B; --plate-ink:#F26A1B;
  --plate-shine:rgba(255,255,255,.16); --plate-pip:rgba(255,255,255,.22); --near-pip:#FFFFFF;
  --focus:#0B0B0B; --shadow:rgba(0,0,0,.35); --accent:#0B0B0B; --on-accent:#FFFFFF; --toast-hi:#F26A1B; color-scheme:light;
}

  --canvas:#F07A1A; --panel:#FF9B4A; --ink:#0B0B0B; --muted:#2E1A0A; --line:#0B0B0B; --well:#FFB676;
  --bar:#0B0B0B; --bar-ink:#F07A1A; --bar-muted:#F07A1A; --bar-line:#F07A1A;
  --rope-r:#F07A1A; --rope-w:#0B0B0B; --rope-b:#F07A1A;
  --plate-a:#2E2E2E; --plate-b:#0B0B0B; --plate-c:#000000; --plate-edge:#F07A1A; --plate-ink:#F07A1A;
  --plate-shine:rgba(255,140,40,.18); --plate-pip:rgba(255,140,40,.25); --near-pip:#F07A1A;
  --focus:#0B0B0B; --shadow:rgba(0,0,0,.35); --accent:#0B0B0B; --on-accent:#F07A1A; --toast-hi:#F07A1A; color-scheme:light;
}
:root[data-egg="nacho"]{

  --plate-shine:rgba(255,255,255,.3); --plate-pip:rgba(255,255,255,.35); --near-pip:#0A1A3F;
  --focus:#0A1A3F; --shadow:rgba(10,26,63,.35); --accent:#C8102E; --on-accent:#FFFFFF; --toast-hi:#5B8DEF; color-scheme:light;
}
:root[data-egg="angle"]{
  --canvas:#F3F5FA; --panel:#FFFFFF; --ink:#0B1F4D; --muted:#3D4A6B; --line:#C8102E; --well:#E2E7F3;
  --bar:#0B1F4D; --bar-ink:#FFFFFF; --bar-muted:#AFC0E8; --bar-line:#C8102E;
  --rope-r:#C8102E; --rope-w:#FFFFFF; --rope-b:#C8102E;
  --plate-a:#2B4C9C; --plate-b:#0B1F4D; --plate-c:#06112B; --plate-edge:#C8102E; --plate-ink:#FFFFFF;
  --plate-shine:rgba(255,255,255,.25); --plate-pip:rgba(255,255,255,.3); --near-pip:#FFFFFF;
  --focus:#C8102E; --shadow:rgba(11,31,77,.25); --accent:#C8102E; --on-accent:#FFFFFF; --toast-hi:#FF6B7D; color-scheme:light;
}
:root[data-egg="newday"]{
  --canvas:#8EC8F2; --panel:#FFFFFF; --ink:#1A1446; --muted:#2E2A63; --line:#1A1446; --well:#FFE0EE;
  --bar:#E8418B; --bar-ink:#FFFFFF; --bar-muted:#FFD1E6; --bar-line:#FFFFFF;
  --rope-r:#FFFFFF; --rope-w:#1D6FE0; --rope-b:#FFFFFF;
  --plate-a:#FF9CCB; --plate-b:#E8418B; --plate-c:#A3175A; --plate-edge:#1A1446; --plate-ink:#FFFFFF;
  --plate-shine:rgba(255,255,255,.35); --plate-pip:rgba(255,255,255,.4); --near-pip:#1A1446;
  --focus:#1A1446; --shadow:rgba(26,20,70,.25); --accent:#E8418B; --on-accent:#FFFFFF; --toast-hi:#FF9CCB; color-scheme:light;
}
:root[data-egg="dibiase"]{
  --canvas:#CFE3C4; --panel:#FFFDF2; --ink:#10231A; --muted:#2F4A37; --line:#9C7F1E; --well:#E9E3C4;
  --bar:#14432A; --bar-ink:#F2D16B; --bar-muted:#C9A227; --bar-line:#C9A227;
  --rope-r:#D4AF37; --rope-w:#14432A; --rope-b:#D4AF37;
  --plate-a:#F7E08A; --plate-b:#D4AF37; --plate-c:#8A6B12; --plate-edge:#14432A; --plate-ink:#10231A;
  --plate-shine:rgba(255,250,220,.55); --plate-pip:rgba(255,250,220,.45); --near-pip:#10231A;
  --focus:#14432A; --shadow:rgba(16,35,26,.25); --accent:#14432A; --on-accent:#F2D16B; --toast-hi:#F2D16B; color-scheme:light;
}
:root[data-egg="lod"]{
  --canvas:#141414; --panel:#222222; --ink:#F2F2F2; --muted:#B5B5B5; --line:#E31B23; --well:#333333;
  --bar:#000000; --bar-ink:#E31B23; --bar-muted:#E31B23; --bar-line:#E31B23;
  --rope-r:#E31B23; --rope-w:#000000; --rope-b:#E31B23;
  --plate-a:#3A3A3A; --plate-b:#121212; --plate-c:#000000; --plate-edge:#E31B23; --plate-ink:#E31B23;
  --plate-shine:rgba(255,255,255,.12); --plate-pip:rgba(227,27,35,.5); --near-pip:#FFFFFF;
  --focus:#E31B23; --shadow:rgba(0,0,0,.6); --accent:#E31B23; --on-accent:#FFFFFF; --toast-hi:#E31B23; color-scheme:dark;
}
:root[data-egg="deadlock"] .field input{background:#FFFFFF}
:root[data-egg="taz"] .field input{background:#FFB676}
/* Pages that name their accent differently pick the theme's accent up too */
:root[data-egg]{--gold:var(--accent);--gold-ink:var(--on-accent);--accent-soft:color-mix(in srgb, var(--accent) 22%, var(--panel))}

/* Header buttons that open the sheet (pages that don't already style a .statbtn) */
.hs-hbtn{background:none;border:0;border-radius:999px;padding:7px 13px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--bar-line, var(--bar-muted));
  color:var(--bar-ink);font-family:var(--f-label);font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.hs-hbtn:hover,.hs-hbtn:focus-visible{background:var(--bar-ink);color:var(--bar)}
.hs-hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

<script>
/* House of Hoss shared layer. Every game and page lives on houseofhoss.com, so they all share one browser save (localStorage).

     HOSS.earn(game, id)    an achievement ("tr" Title Run, "rr" Roydle Rumble, "bb" Blind Booker)
     HOSS.foundEgg(id)      an Easter egg (shared by every game)
     HOSS.look(theme)       an Egg Card's temporary theme ("" = back to the saved color scheme)

(function(){

  {id: "taz",      name: "Taz",                by: "taz",      note: "Orange and black.",                        sw: ["#F07A1A", "#0B0B0B", "#FF9B4A"]},

  {id: "angle",    name: "Kurt Angle",         by: "angle",    note: "Red, white and blue.",                     sw: ["#F3F5FA", "#0B1F4D", "#C8102E"]},

const ACH_KEY = g => g + "-ach", EGG_KEY = "tr-eggs", SKIN_KEY = "hoh-skin";
const achFound = g => store.get(ACH_KEY(g)) || {};
const eggsFound = () => store.get(EGG_KEY) || {};
const firstWin = () => GAMES.some(g => achFound(g.id)[g.ach[0].id]);
const skinOpen = s => s.by === "first" ? firstWin() : !!eggsFound()[s.by];

/* ---- Look: the saved color scheme, unless an Egg Card's theme is showing */
let skin = "", temp = "";
function savedSkin(){
  let s = store.get(SKIN_KEY);
  if(s === null){ s = store.get("tr-skin") || ""; store.set(SKIN_KEY, s); }          // Title Run used to keep its own
  const k = SKINS.find(x => x.id === s);
  return k && k.id && skinOpen(k) ? k.id : "";

function look(t){
  if(t !== undefined) temp = t || "";

/* ---- Toasts (they queue; tapping one opens the sheet) */
let toastEl = null, toastTimer = 0, toastQ = [], toastBusy = false, toastView = "ach";

  }
  const t = toastQ.shift();
  if(!t){ toastBusy = false; toastEl.classList.remove("show"); return; }
  toastBusy = true; toastView = t.view || "ach";
  toastEl.innerHTML = `<span>${esc(t.kicker)}</span><b>${esc(t.title)}</b><small>${esc(t.line)}</small>`;
  toastEl.classList.remove("show"); void toastEl.offsetWidth; toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(nextToast, 4500);
}

function earn(g, id){
  const game = GAME[g]; if(!game) return;
  const f = achFound(g); if(f[id]) return;
  const a = game.ach.find(x => x.id === id); if(!a) return;
  const unlocksDefault = id === game.ach[0].id && !firstWin() && skin;                  // a first win is the way back to the default colors
  f[id] = Date.now(); store.set(ACH_KEY(g), f);
  const n = game.ach.filter(x => f[x.id]).length;
  toast("Achievement unlocked", a.title, unlocksDefault ? "Default colors unlocked. Tap to see them." : `${n} of ${game.ach.length} ${game.name} achievements. Tap to see them.`, unlocksDefault ? "unlocks" : "ach");
  render();
}
function foundEgg(id){

/* ---- Stats (read straight from each game's save) */
const dayNo = launch => { if(!launch) return 0; const d = new Date(), [y, m, dd] = launch.split("-").map(Number);
  return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(y, m - 1, dd)) / 864e5) + 1; };
const liveStreak = (st, n) => st.lastWin >= n - 1 ? st.streak : 0;
function modeRows(prefix, modes, launch){
  const n = dayNo(launch);
  return `<table class="hs-tbl"><thead><tr><th></th><th>Played</th><th>Win %</th><th>Streak</th><th>Best</th></tr></thead><tbody>`
    + modes.map(([k, label]) => { const st = Object.assign({played: 0, wins: 0, streak: 0, best: 0, lastWin: 0}, store.get(`${prefix}-stats-${k}`) || {});
        return `<tr><th>${esc(label)}</th><td>${st.played}</td><td>${st.played ? Math.round(st.wins / st.played * 100) : 0}</td><td>${liveStreak(st, n)}</td><td>${st.best}</td></tr>`; }).join("")
    + `</tbody></table>`;
}
const BB_STARS = [5, 4, 3, 2, 1];                          // card ratings by whole stars (3 = ★★★ to ★★★¾)
function bbStats(){
  const st = Object.assign({played: 0, cards: 0, streak: 0, best: 0, lastDone: 0, topStars: 0, stars: {}}, store.get("bb-stats") || {});

  return `<div class="hs-nums"><div><b>${st.topStars ? st.topStars.toFixed(2) : "-"}</b><span>Best rating</span></div><div><b>${st.played}</b><span>Daily cards</span></div>`

    + `<ol class="hs-dist" aria-label="Card ratings">` + BB_STARS.map(k => { const v = st.stars[k] || 0;
        return `<li><span>${k}★</span><span class="bar" style="width:${Math.max(9, v / max * 100)}%">${v}</span></li>`; }).join("") + `</ol>`

}
const CAH_BANDS = [[99, "99"], [90, "90+"], [80, "80+"], [76, "76+"], [70, "70+"], [0, "Under 70"]];
function cahStats(){
  const st = Object.assign({played: 0, hosses: 0, streak: 0, best: 0, lastDone: 0, top: 0, ovr: {}}, store.get("cah-stats") || {});
  const n = dayNo(CFG.launch.cah), streak = st.lastDone >= n - 1 ? st.streak : 0, bands = CAH_BANDS.map(() => 0);
  Object.entries(st.ovr).forEach(([o, c]) => { bands[CAH_BANDS.findIndex(([min]) => +o >= min)] += c; });
  const max = Math.max(1, ...bands);

    + `<p class="hs-fine">${st.hosses} Hoss${st.hosses === 1 ? "" : "es"} built in all, free play included. Top OVR and the chart count every finished Hoss.</p>`;

  const parts = {
    tr: () => `<h3>Title Run</h3>` + modeRows("tr", [["base", "Base"], ["mark", "Mark"], ["smart", "Smart Mark"], ["chaos", "Chaos"]], CFG.launch.tr),
    rr: () => `<h3>Roydle Rumble</h3>` + modeRows("rr", [["m", "Men's"], ["w", "Women's"]], CFG.launch.rr),
    bb: () => `<h3>Blind Booker</h3>` + bbStats(),
    cah: () => `<h3>Create-A-Hoss</h3>` + cahStats(),
  };
  const ids = only ? [only] : ["tr", "rr", "bb", "cah"];
  return ids.map(id => `<section class="hs-sec">${parts[id]()}</section>`).join("")
    + `<p class="hs-fine">Daily games only, except where noted. Everything is saved in this browser, so a new device starts fresh.</p>`;
}

/* ---- Awards */
const shortDate = ts => new Date(ts).toLocaleDateString("en-US", {month: "short", day: "numeric"});
const card = (a, i, ts, egg) => `<li class="hs-ach ${ts ? "got" : "locked"}"><span class="no">No. ${pad(i + 1)}</span><i class="emb" aria-hidden="true">${ts ? (egg ? "!" : esc(a.g)) : "?"}</i>`
  + `<b>${esc(a.title)}</b>${egg ? "" : `<span class="d">${esc(a.desc)}</span>`}<span class="st">${ts ? "Earned " + shortDate(ts) : egg ? "Not found yet" : "Locked"}</span></li>`;
function achHTML(){
  const order = CFG.game ? [GAME[CFG.game], ...GAMES.filter(g => g.id !== CFG.game)] : GAMES;
  return order.map(g => { const f = achFound(g.id), n = g.ach.filter(a => f[a.id]).length;
    return `<section class="hs-sec"><h3>${esc(g.name)} · ${n} of ${g.ach.length}</h3><ul class="hs-roster">${g.ach.map((a, i) => card(a, i, f[a.id], false)).join("")}</ul></section>`; }).join("");
}
function eggsHTML(){
  const f = eggsFound(), n = EGGS.filter(a => f[a.id]).length;
  return `<section class="hs-sec"><h3>${n} of ${EGGS.length} found</h3><ul class="hs-roster">${EGGS.map((a, i) => card(a, i, f[a.id], true)).join("")}</ul>`
    + `<p class="hs-fine">Hidden all over the games. Each title is your only hint.</p></section>`;
}
function unlocksHTML(){
  const hidden = SKINS.some(s => s.by !== "first" && !skinOpen(s));
  const tile = s => { const openNow = skinOpen(s), on = skin === s.id;
    return `<li class="hs-skin${on ? " on" : ""}${openNow || on ? "" : " locked"}"><span class="sw" aria-hidden="true">${s.sw.map(c => `<i style="background:${c}"></i>`).join("")}</span>`
      + `<b>${esc(s.name)}</b><span class="d">${openNow || on ? esc(s.note) : "Win any game to unlock."}</span>`
      + `<button type="button" class="hs-btn" data-skin="${esc(s.id)}"${openNow && !on ? "" : " disabled"}>${on ? "In use" : openNow ? "Use" : "Locked"}</button></li>`; };
  const mystery = hidden ? `<li class="hs-skin locked"><span class="sw" aria-hidden="true"><i></i><i></i><i></i></span><b>???</b><span class="d">More color schemes are out there.</span></li>` : "";
  return `<section class="hs-sec"><h3>Color schemes</h3><ul class="hs-roster">${SKINS.filter(s => s.by === "first" || skinOpen(s)).map(tile).join("")}${mystery}</ul>`
    + `<p class="hs-fine">Your pick follows you to every game on the site, on this device. Once you pick something else, getting back to Default takes a first win in any game.</p></section>`;
}

/* ---- The sheet: a full-screen page over the site. X, Esc or the back button closes it. */
const STATS_HERE = !CFG.game || CFG.game === "bb" || CFG.game === "cah";        // homepage: every game's stats. Blind Booker: its own. The others have their own Stats pages.
let sheet = null, view = "ach";
function tabs(){ return [...(STATS_HERE ? [["stats", "Stats"]] : []), ["ach", "Achievements"], ["eggs", "Easter Eggs"], ["unlocks", "Unlocks"]]; }
function render(){
  if(!sheet) return;
  if(!tabs().some(([v]) => v === view)) view = "ach";
  const title = view === "stats" ? "Stats" : "Awards";
  sheet.querySelector("h2").textContent = title;
  sheet.setAttribute("aria-label", title);
  sheet.querySelector(".hs-seg").innerHTML = tabs().map(([v, l]) => `<button type="button" data-view="${v}" aria-pressed="${view === v}">${l}</button>`).join("");
  sheet.querySelector(".hs-body").innerHTML = view === "stats" ? statsHTML(CFG.game || "") : view === "eggs" ? eggsHTML() : view === "unlocks" ? unlocksHTML() : achHTML();
}
function open(v){
  view = v || "ach";
  if(!sheet){
    sheet = document.createElement("div"); sheet.className = "hs-sheet"; sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-modal", "true");
    sheet.innerHTML = `<div class="hs-in"><div class="hs-h"><h2></h2><button type="button" class="hs-x" aria-label="Close">&times;</button></div>`
      + `<div class="hs-seg" role="group" aria-label="View"></div><div class="hs-body"></div></div>`;
    sheet.addEventListener("click", e => {
      const v2 = e.target.closest("button[data-view]"), k = e.target.closest("button[data-skin]");
      if(e.target.closest(".hs-x")) close();
      else if(v2){ view = v2.dataset.view; render(); sheet.scrollTop = 0; }
      else if(k && !k.disabled) setSkin(k.dataset.skin);
    });
    document.documentElement.appendChild(sheet);
    try{ history.pushState({hoss: 1}, ""); }catch(e){}
  }
  document.documentElement.classList.add("hs-open");
  render(); sheet.scrollTop = 0;
  const x = sheet.querySelector(".hs-x"); if(x) x.focus({preventScroll: true});
}
function close(fromHistory){
  if(!sheet) return;
  sheet.remove(); sheet = null; document.documentElement.classList.remove("hs-open");
  if(!fromHistory){ try{ if(history.state && history.state.hoss) history.back(); }catch(e){} }
}
addEventListener("popstate", () => { if(sheet) close(true); });
addEventListener("keydown", e => { if(e.key === "Escape" && sheet) close(); });
document.addEventListener("click", e => { const b = e.target.closest("[data-hoss]"); if(b){ e.preventDefault(); open(b.dataset.hoss); } });

skin = savedSkin(); look();
window.HOSS = {earn, foundEgg, look, open, close, achFound, eggsFound, setSkin, GAMES, EGGS, SKINS, store,
  get skin(){ return skin; }};
})();
</script>
</head>

  {id: "fin",   i: 4, name: "Finisher",   side: "r", at: [0.92, 0.33]},   // hand
];
const SLOT = Object.fromEntries(SLOTS.map(s => [s.id, s]));
const ORDER = ["pop", "promo", "ring", "look", "fin"];   // order used in the share text and the perfect Hoss list

/* OVR from the five ratings added up (5 to 25). Pete's bands: 99 perfect, 90-98 great, 80-89 good, 76-79 decent,
   70-75 bad, 60 legit awful. Every number here is a knob. */
const OVR = {25: 99, 24: 98, 23: 96, 22: 93, 21: 90, 20: 88, 19: 86, 18: 84, 17: 80, 16: 78, 15: 76, 14: 75, 13: 73, 12: 71, 11: 70};
const ovrOf = total => OVR[total] ?? 60;
const VERDICT = [[99, "The Greatest Hoss of All Time"], [90, "Great Hoss"], [80, "Good Hoss"], [76, "Decent Hoss"], [70, "Bad Hoss"], [0, "Legit awful"]];
const verdictOf = o => VERDICT.find(([c]) => o >= c)[1];

/* Seeded draws: the same seed always draws the same five wrestlers in the same order.
   Daily seed = the local date, so everyone gets the same five that day. */
function xmur3(str){ let h = 1779033703 ^ str.length;
  for(let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; }; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function draw(seed){
  const r = mulberry32(xmur3("cah|" + seed)()), idx = NAMES.map((_, i) => i), out = [];
  for(let i = 0; i < SLOTS.length; i++){ const j = i + Math.floor(r() * (idx.length - i)); [idx[i], idx[j]] = [idx[j], idx[i]]; out.push(idx[i]); }
  return out;                                          // indices into NAMES, in draw order
}

/* Dates and puzzle numbers (local midnight, like the other games) */
const pad = n => String(n).padStart(2, "0");
const localISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayNo = iso => { const [y,m,d] = iso.split("-").map(Number), [ly,lm,ld] = D.launch.split("-").map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(ly, lm - 1, ld)) / 864e5) + 1; };

/* Game state: the seed, whether the title card was clicked (s), and the slot each drawn wrestler went into (w).
   Everything else is replayed from those. */
let S = null, fresh = null;
const valid = g => g && g.v === SAVE_V && Array.isArray(g.w) && typeof g.seed === "string";
function load(mode){
  if(mode === "daily"){
    const today = localISO(new Date()), saved = store.get("cah-daily");
    S = valid(saved) && saved.seed === today ? saved : {v: SAVE_V, seed: today, s: 0, w: []};
  } else {
    const saved = store.get("cah-free");
    S = valid(saved) ? saved : newFree(0);
  }
  S.mode = mode; S.draws = draw(S.seed); fresh = null;
  store.set("cah-mode", mode);
}
const newFree = started => ({v: SAVE_V, seed: "free-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), s: started, w: []});
function save(){ const {draws: _, mode, ...keep} = S; store.set(mode === "daily" ? "cah-daily" : "cah-free", keep); }

const done = () => S.w.length >= SLOTS.length;
const whoIn = id => { const k = S.w.indexOf(id); return k < 0 ? null : S.draws[k]; };   // index into NAMES
const rating = (who, id) => RAT[who][SLOT[id].i];
const total = assign => SLOTS.reduce((a, s) => a + rating(assign[s.id], s.id), 0);
const mine = () => Object.fromEntries(SLOTS.map(s => [s.id, whoIn(s.id)]));

// Best possible Hoss from the same five draws (120 ways to place them; check them all)
function perfectHoss(){
  let best = null, bestT = -1;
  const ids = SLOTS.map(s => s.id);
  (function perm(k, used, assign){
    if(k === S.draws.length){ const t = total(assign); if(t > bestT){ bestT = t; best = {...assign}; } return; }
    ids.forEach(id => { if(!used.has(id)){ used.add(id); assign[id] = S.draws[k]; perm(k + 1, used, assign); used.delete(id); } });
  })(0, new Set(), {});
  return {assign: best, total: bestT, ovr: ovrOf(bestT)};
}

function start(){ if(S.s) return; S.s = 1; fresh = "draw"; save(); render(); }
function place(id){
  if(!S.s || done() || S.w.includes(id)) return;
  S.w.push(id); fresh = id; save(); render();
  if(done()){
    hossDone();
    const k = winKind();                                  // a Perfect Hoss gets confetti; a 99 gets double
    if(k){ window.scrollTo({top: 0, behavior: "smooth"}); confetti(k === "goat" ? 2 : 1); }
  }
}
/* "goat" = 99 OVR (THE GREATEST HOSS OF ALL TIME). "perfect" = the best total these five could make, short of 99. "" = neither. */
function winKind(){
  const t = total(mine());
  return ovrOf(t) === 99 ? "goat" : t >= perfectHoss().total ? "perfect" : "";
}
// Stats, saved for the shared Stats page later (cah-stats). Each finished Hoss counts once, by mode + seed.
function hossDone(){
  const o = ovrOf(total(mine())), key = S.mode + ":" + S.seed;
  const st = Object.assign({played: 0, hosses: 0, streak: 0, best: 0, lastDone: 0, ovr: {}, seen: []}, store.get("cah-stats") || {});
  if(st.seen.includes(key)) return;
  st.seen = [...st.seen.slice(-60), key];
  st.hosses++; st.top = Math.max(st.top || 0, o); st.ovr[o] = (st.ovr[o] || 0) + 1;
  if(S.mode === "daily"){ const n = dayNo(S.seed); st.played++; st.streak = st.lastDone === n - 1 ? st.streak + 1 : 1; st.best = Math.max(st.best, st.streak); st.lastDone = n; }
  store.set("cah-stats", st);
  if(!window.HOSS) return;                                // the Claude preview has no site layer
  const earn = id => HOSS.earn("cah", id), parts = SLOTS.map(sl => rating(mine()[sl.id], sl.id)), k = winKind();
  earn("first");
  if(k) earn("perfect");
  if(o >= 90) earn("great");
  if(o === 99) earn("goat");
  if(parts.every(r => r >= 3)) earn("noweak");
  if(o <= 60) earn("awful");
  if(S.mode === "daily"){ if(st.streak >= 3) earn("three"); if(st.streak >= 7) earn("iron"); }
  if(st.hosses >= 25) earn("vet");
}

/* Rendering */
/* Ratings are never shown as numbers (Pete, Nov 10: no 1-5 scale for people to argue over). A finished Hoss colors each name
   instead: 5 green, 3-4 yellow, 2 orange, 1 red. The word is only for screen readers. Share text uses the matching squares. */
const GRADE = r => r >= 5 ? {c: "g", sq: "🟩", w: "top marks"} : r >= 3 ? {c: "y", sq: "🟨", w: "solid"} : r === 2 ? {c: "o", sq: "🟧", w: "weak"} : {c: "r", sq: "🟥", w: "awful"};
const nameHTML = (who, id) => { const g = GRADE(rating(who, id)); return `<span class="hl ${g.c}">${esc(NAMES[who])}<span class="sr"> (${g.w})</span></span>`; };
function tagHTML(s, over, live, best){
  const who = whoIn(s.id);
  if(who === null){
    if(live) return `<button type="button" class="tag" data-slot="${s.id}"><span class="k">${s.name}</span><span class="who none">Put them here</span></button>`;
    return `<div class="tag" data-slot="${s.id}"><span class="k">${s.name}</span><span class="who none">Open</span></div>`;
  }
  return `<div class="tag${fresh === s.id ? " fresh" : ""}${best ? " best" : ""}" data-slot="${s.id}">
    <span class="k">${s.name}</span><span class="who">${over ? nameHTML(who, s.id) : esc(NAMES[who])}</span>
    ${over && s.id === "fin" ? `<span class="move">${esc(MOVE[who])}</span>` : ""}</div>`;
}
function render(){
  const plate = $("#plate"), over = done(), title = !S.s, live = S.s && !over;
  $("#modeDaily").setAttribute("aria-pressed", S.mode === "daily");
  $("#modeFree").setAttribute("aria-pressed", S.mode === "free");
  $("#metaL").textContent = S.mode === "daily" ? `Daily #${dayNo(S.seed)}` : "Free play";
  $("#metaR").textContent = S.mode === "daily" ? new Date().toLocaleDateString(undefined, {weekday: "short", month: "short", day: "numeric"}) : "";
  plate.classList.toggle("tap", title); plate.classList.toggle("title", title);
  plate.classList.toggle("win", over && !!winKind());
  if(title){ plate.setAttribute("role", "button"); plate.tabIndex = 0; } else { plate.removeAttribute("role"); plate.removeAttribute("tabindex"); }
  if(title){
    $("#drawEyebrow").textContent = S.mode === "daily" ? `Daily #${dayNo(S.seed)}` : "Free play";
    $("#drawName").textContent = "Create-A-Hoss";
    $("#drawSub").textContent = "Click to begin";
    $("#hint").textContent = "";
  } else if(!over){
    $("#drawEyebrow").textContent = `Wrestler ${S.w.length + 1} of ${SLOTS.length}`;
    $("#drawName").textContent = NAMES[S.draws[S.w.length]];
    $("#drawSub").textContent = " ";
    $("#hint").textContent = "Click a label to give your Hoss this part of them. No take-backs.";
  } else {
    const o = ovrOf(total(mine())), k = winKind();
    $("#drawEyebrow").textContent = S.mode === "daily" ? `Create-A-Hoss #${dayNo(S.seed)}` : "Free play";
    if(k === "goat"){
      $("#drawName").innerHTML = `<span class="goat">The Greatest Hoss of All Time</span>`;
      $("#drawSub").textContent = "99 OVR";
    } else if(k === "perfect"){
      $("#drawName").textContent = "Perfect Hoss";
      $("#drawSub").textContent = `${o} OVR. You scored the perfect score with these options.`;
    } else {
      $("#drawName").innerHTML = `<span class="ovr"><b>${o}</b><small>OVR</small></span>`;
      $("#drawSub").textContent = verdictOf(o);
    }
    $("#hint").textContent = "";
  }
  if(fresh){ plate.classList.remove("glint"); void plate.offsetWidth; plate.classList.add("glint"); }
  const showBest = over && S.pf ? perfectHoss().assign : null;
  for(const side of ["l", "r"]) $("#col" + side.toUpperCase()).innerHTML =
    SLOTS.filter(s => s.side === side).map(s => tagHTML(s, over, live, showBest && showBest[s.id] === whoIn(s.id))).join("");
  $("#done").hidden = !over;
  if(over){
    $("#share").textContent = shareFull();
    $("#doneTitle").textContent = S.mode === "daily" ? "Today's Hoss" : "Your Hoss";
    $("#againBtn").textContent = S.mode === "daily" ? "Free play" : "Build another";
    renderPerfect();
  }
  $("#status").textContent = over && S.mode === "daily" ? nextLine() : "";
  $("#foot").textContent = `${NAMES.length} wrestlers in the pool. A new daily Hoss at midnight your time.`;
  wires();
}
function renderPerfect(){
  $("#perfectBtn").hidden = !!S.pf; $("#perfect").hidden = !S.pf;
  if(!S.pf) return;
  const p = perfectHoss(), mineT = total(mine());
  $("#perfect").innerHTML = `<h3>Perfect Hoss: ${p.ovr} OVR</h3>
    <ul>${ORDER.map(id => `<li><span>${SLOT[id].name}</span><span class="pw">${nameHTML(p.assign[id], id)}</span></li>`).join("")}</ul>
    <p>${mineT >= p.total ? "You built the best Hoss these five could make." : `Yours: ${ovrOf(mineT)} OVR. The best these five could make is ${p.ovr}.`}</p>`;
}

/* Confetti for a Perfect Hoss (level 1) or a 99 (level 2: twice the pieces, cannons from both bottom corners, and a second
   wave). A canvas over the whole page that never takes taps and removes itself when the last piece is gone.
   Skipped for people who ask for reduced motion. */
function confetti(level){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"), ctx = cv.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.style.cssText = "position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:2147483000";
  const fit = () => { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; };
  fit(); window.addEventListener("resize", fit);
  document.documentElement.appendChild(cv);
  const COLORS = ["#5B18EA", "#8F5CFF", "#C3C7CD", "#F4F5F7", "#F2D04B", "#5CCB7E", "#0E0F12"];
  const P = [], W = () => innerWidth, H = () => innerHeight, rnd = (a, b) => a + Math.random() * (b - a);
  const piece = (x, y, vx, vy) => P.push({x, y, vx, vy, w: rnd(6, 11), h: rnd(9, 16), r: rnd(0, 6.3), vr: rnd(-.25, .25),
    s: rnd(0, 6.3), c: COLORS[Math.floor(Math.random() * COLORS.length)]});
  const rain = n => { for(let i = 0; i < n; i++) piece(rnd(0, W()), rnd(-H() * .5, -10), rnd(-1.5, 1.5), rnd(1, 4)); };
  const cannons = n => { for(let i = 0; i < n; i++){ const left = i % 2 === 0;
    piece(left ? -10 : W() + 10, H() * rnd(.75, 1), (left ? 1 : -1) * rnd(4, 11), -rnd(10, 19)); } };
  rain(130 * level);
  if(level > 1){ cannons(160); setTimeout(() => { rain(160); cannons(120); }, 900); }
  let last = performance.now(), born = last;
  (function frame(now){
    const dt = Math.min(2.5, (now - last) / 16.7); last = now;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W(), H());
    for(const p of P){
      p.vy = Math.min(p.vy + .32 * dt, 6); p.vx *= Math.pow(.985, dt); p.s += .08 * dt;
      p.x += (p.vx + Math.sin(p.s) * .8) * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.cos(p.s * 1.7));
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    for(let i = P.length - 1; i >= 0; i--) if(P[i].y > H() + 30) P.splice(i, 1);
    if((P.length || now - born < 1200) && now - born < 9000) requestAnimationFrame(frame);
    else { window.removeEventListener("resize", fit); cv.remove(); }
  })(last);
}

/* Leader lines: from the inner edge of each label to its body point on the figure */
function wires(){
  const svg = $("#wires"), stage = $("#stage").getBoundingClientRect(), fig = $("#fig").getBoundingClientRect();
  if(!fig.width) return;
  svg.setAttribute("viewBox", `0 0 ${stage.width} ${stage.height}`);
  svg.innerHTML = SLOTS.map(s => {
    const el = document.querySelector(`.tag[data-slot="${s.id}"]`); if(!el) return "";
    const b = el.getBoundingClientRect(), left = s.side === "l";
    const x1 = (left ? b.right : b.left) - stage.left, y1 = b.top + Math.min(22, b.height / 2) - stage.top;
    const x2 = fig.left - stage.left + s.at[0] * fig.width, y2 = fig.top - stage.top + s.at[1] * fig.height;
    const xm = x1 + (left ? 8 : -8);
    return `<g class="${el.tagName === "BUTTON" ? "live" : ""}"><path d="M${x1} ${y1}H${xm}L${x2} ${y2}"/><circle cx="${x2}" cy="${y2}" r="4.5"/></g>`;
  }).join("");
}

/* Share text. Short = OVR and a colored square per slot, no names (no spoilers for the daily). Full = names and the finisher too. */
const head = () => S.mode === "daily" ? `Create-A-Hoss #${dayNo(S.seed)}` : "Create-A-Hoss free play";
function resultLine(){
  const o = ovrOf(total(mine())), k = winKind();
  return k === "goat" ? "My Hoss: 99 OVR. THE GREATEST HOSS OF ALL TIME" : k === "perfect" ? `My Hoss: ${o} OVR. Perfect Hoss!` : `My Hoss: ${o} OVR (${verdictOf(o)})`;
}
function shareShort(){
  const a = mine();
  return [head(), resultLine(), ...ORDER.map(id => `${GRADE(rating(a[id], id)).sq} ${SLOT[id].name}`),
    ...(D.site ? ["", D.site] : [])].join("\n");
}
function shareFull(){
  const a = mine();
  return [head(), resultLine(), "",
    ...ORDER.map(id => `${GRADE(rating(a[id], id)).sq} ${SLOT[id].name}: ${NAMES[a[id]]}${id === "fin" ? ` (${MOVE[a[id]]})` : ""}`),
    ...(D.site ? ["", D.site] : [])].join("\n");
}
function nextLine(){
  const now = new Date(), t = new Date(now); t.setHours(24, 0, 0, 0);
  const mins = Math.max(1, Math.round((t - now) / 6e4));
  return `New Hoss in ${Math.floor(mins / 60)}h ${mins % 60}m.`;
}
function copy(text){
  const ok = () => { $("#status").textContent = "Copied. Go start an argument."; };
  const fallback = () => { const box = $("#copyBox"); box.value = text; box.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ $("#status").textContent = "Couldn't copy. Select the text and copy it yourself."; } };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
}

/* Wiring */
$("#stage").addEventListener("click", e => { const b = e.target.closest("button[data-slot]"); if(b) place(b.dataset.slot); });
$("#plate").addEventListener("click", () => { if($("#plate").classList.contains("tap")) start(); });
$("#plate").addEventListener("keydown", e => {
  if($("#plate").classList.contains("tap") && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); start(); } });
$("#modeDaily").addEventListener("click", () => { load("daily"); render(); });
$("#modeFree").addEventListener("click", () => { load("free"); render(); });
$("#againBtn").addEventListener("click", () => {
  if(S.mode === "free") store.set("cah-free", newFree(1));       // straight to the first draw, no title card
  load("free"); render(); window.scrollTo({top: 0, behavior: "smooth"});
});
$("#copyShort").addEventListener("click", () => copy(shareShort()));
$("#copyFull").addEventListener("click", () => copy(shareFull()));
$("#perfectBtn").addEventListener("click", () => { S.pf = 1; save(); render(); });
$("#fig").addEventListener("load", wires);
window.addEventListener("resize", wires);
if(window.ResizeObserver) new ResizeObserver(wires).observe($("#stage"));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(wires);
setInterval(() => { if(S && S.mode === "daily" && done()) $("#status").textContent = nextLine(); }, 60000);

load(store.get("cah-mode") === "free" ? "free" : "daily");
render();

</script>
</body>
</html>
